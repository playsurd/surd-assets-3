   <script>
    function mergeFiles(fileParts) {
        return new Promise((resolve, reject) => {
            let buffers = [];
            function fetchPart(index) {
                if (index >= fileParts.length) {
                    let mergedBlob = new Blob(buffers);
                    let mergedFileUrl = URL.createObjectURL(mergedBlob);
                    resolve(mergedFileUrl);
                    return;
                }
                fetch(fileParts[index]).then((response) => response.arrayBuffer()).then((data) => {
                    buffers.push(data);
                    fetchPart(index + 1);
                }).catch(reject);
            }
            fetchPart(0);
        });
    }
    function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
            parts.push(file + ".part" + i);
        }
        return parts;
    }
    async function mergeWasmParts() {
        const parts = ['renpy.wasm.part1', 'renpy.wasm.part2'];
        
        const responses = await Promise.all(
            parts.map(part => fetch(part))
        );
      
        const buffers = await Promise.all(
            responses.map(r => r.arrayBuffer())
        );
        
        const mergedBlob = new Blob(buffers);
        return URL.createObjectURL(mergedBlob);
    }
    mergeWasmParts().then(wasmUrl => {
        window.wasmBinaryFile = wasmUrl;
        
        return mergeFiles(getParts("game.zip", 1, 1));
    }).then(gameZipURL => {
        window.gameZipURL = gameZipURL;
        let renpypre = document.createElement("script");
        renpypre.src = "renpy-pre.js";  
        renpypre.onload = function() {
            let renpy = document.createElement("script");
            renpy.src = "renpy.js";  
            document.body.appendChild(renpy);
        };
        
        document.body.appendChild(renpypre);
    }).catch(error => {
        console.error("Error loading game files:", error);
    });
</script>
