  });

  consoleSubmit.addEventListener('click', handleConsoleInput);
  consoleClose.addEventListener('click', toggleConsole);

  var isDragging = false;
  var currentX;
  var currentY;
  var initialX;
  var initialY;
  var xOffset = 0;
  var yOffset = 0;

  function dragStart(e) {
    initialX = e.clientX - xOffset;
    initialY = e.clientY - yOffset;
    isDragging = true;
  }

  function dragEnd(e) {
    initialX = currentX;
    initialY = currentY;
    isDragging = false;
  }

  function drag(e) {
    if (isDragging) {
      e.preventDefault();
      currentX = e.clientX - initialX;
      currentY = e.clientY - initialY;

      xOffset = currentX;
      yOffset = currentY;

      consoleElement.style.transform = 'translate(' + currentX + 'px, ' + currentY + 'px)';
    }
  }

  document.getElementById('console-header').addEventListener('mousedown', dragStart);
  document.addEventListener('mouseup', dragEnd);
  document.addEventListener('mousemove', drag);


  var Module = {
    preRun: [],
    postRun: [],
    print: (function () {
      return function (text) {
        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
        
        var logEntry = document.createElement('div');
        logEntry.innerHTML = text;
        consoleLog.appendChild(logEntry);
        
        console.log(text);
        consoleLog.parentElement.scrollTop = consoleLog.parentElement.scrollHeight;
      };
    })(),
    printErr: function (text) {
      if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
      console.error(text);
    },
    canvas: (function () {
      var canvas = document.getElementById('canvas');

      canvas.addEventListener("webglcontextlost", function (e) {
        console.error('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);

      return canvas;
    })(),
    hideStatus: function() {
      document.getElementById('loading-overlay').style.display = "none";
    },
    showStatus: function() {
      document.getElementById('loading-overlay').style.display = "flex";
    },
    setStatus: function (text) {
      if (!Module.setStatus.last) Module.setStatus.last = {time: Date.now(), text: ''};
      if (text === Module.setStatus.last.text) return;
      var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      var now = Date.now();
      if (m && now - Module.setStatus.last.time < 30) return;
      Module.setStatus.last.time = now;
      Module.setStatus.last.text = text;
      if (m) {
        text = m[1];
        progressElement.value = parseInt(m[2]) * 100;
        progressElement.max = parseInt(m[4]) * 100;
        progressElement.hidden = false;
        spinnerElement.hidden = false;
      } else {
        progressElement.value = null;
        progressElement.max = null;
        progressElement.hidden = true;
        if (!text) spinnerElement.style.display = 'none';
      }
      statusElement.innerHTML = text;
    },
    totalDependencies: 0,
    monitorRunDependencies: function (left) {
      this.totalDependencies = Math.max(this.totalDependencies, left);
      Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
      if (!left) {
        Module.hideStatus();
      }
      else {
        Module.showStatus();
      }
    }
  };
  Module.setStatus('Downloading...');
  window.onerror = function (event) {
    Module.setStatus('Exception thrown, see JavaScript console');
    spinnerElement.style.display = 'none';
    Module.setStatus = function (text) {
      if (text) Module.printErr('[post-exception status] ' + text);
    };
  };
</script>
