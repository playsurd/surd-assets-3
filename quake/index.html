	<script type='text/javascript'>
// connect to canvas
var Module = {
	setWindowTitle: function(){},   // keep our own page title; ignore engine updates
	arguments: (function(){
		// Explicit manifest URL: without it, FTE derives the manifest name from
		// the page path (/play -> play.fmf -> 404), so it loads NO packages and
		// re-downloads everything (incl. maps) from the game server every time.
		// vid_hardwaregamma 2 = always-GLSL gamma (hardware gamma doesn't exist in
		// WebGL, so without this the gamma cvar is a no-op and the screen stays dark).
		var a = ["-manifest", "ftewebgl.html.fmf", "+set", "con_stayhidden", "1", "+set", "vid_hardwaregamma", "2", "+set", "gamma", "1.05"];
		try {
			var n = (new URLSearchParams(location.search).get('name') || (function(){try{return localStorage.getItem('surd_player_name')}catch(e){return ''}})() || '').replace(/[^A-Za-z0-9 _.\[\]\-]/g,'').trim().slice(0,15);
			if (n) a = a.concat(["+set", "name", n]);
		} catch(e){}
		return a.concat(["+connect", "wss://q1.pieter.com"]);
	})(),
	files:
	{	//these can be arraybuffers(you'll need a helper to define those) or promises(fte will block till they complete), or strings (which will be interpretted as urls and downloaded before any C code is run)
		//note that the code below will skip the file-drop prompt if there's any files specified here (or there's a #foo.fmf file specified)
//		"default.fmf": "default.fmf",
//		"id1/pak0.pak": "pak0.pak",
	},
	print: function(msg)
	{	//stdout...
		console.log(msg);
	},
	printErr: function(text)
	{	//stderr...
		console.log(text);
	},
	canvas: document.getElementById('canvas'),	//for webgl to attach to
	setStatus: function(text)
	{	//gets spammed some prints during startup. blame emscripten.
		if (Module.setStatus.interval)
			clearInterval(Module.setStatus.interval);
		var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
		var statusElement = document.getElementById('status');
		var progressElement = document.getElementById('progress');
		if (m) {
			text = m[1];
			progressElement.value = parseInt(m[2])*100;
			progressElement.max = parseInt(m[4])*100;
			progressElement.hidden = false;
		} else {
			progressElement.value = null;
			progressElement.max = null;
			progressElement.hidden = true;
		}
		statusElement.innerHTML = text;
		statusElement.hidden = text.length==0;
	},
//	preRun: [],
	totalDependencies: 0,
	monitorRunDependencies: function(left)
	{	//progress is progress...

	},
//	onRuntimeInitialized: function(){},

		function(){ var sp=document.getElementById('spinner'); if(sp) sp.style.display='none'; },

function begin()
{
	if (Module.began)
		return;

	// navigator.webdriver) must not load the engine and join the live server.
	
	// Phones/tablets are allowed: /assets/touch-controls.js (shared pieter.com touch layout) gives them
	// a joystick, drag-to-look and shoot/jump buttons (2026-10-07; this used to show "Desktop required").
	Module.began = true;
	document.getElementById('dropzone').hidden = true;
	document.getElementById('begin').hidden = true;
	Module.setStatus('Downloading...');

	// make a script. do it the hard way for the error.
	var s = document.createElement('script');
	// set it up
	s.setAttribute('src',"ftewebgl.js");
	s.setAttribute('type',"text/javascript");
	s.setAttribute('charset',"utf-8");
	s.addEventListener('error', function() {alert("Oh noes! we got an error!"); Module.setStatus("Unable to download engine javascript");}, false);

	document.head.appendChild(s);
}

//stuff to facilitate our drag+drop filesystem support
function fixupfilepath(fname, path)
{	//we just have a filename, try to guess where to put it.
	if (path != "")
		return path+fname;	//already has a path. use it. this allows people to drag+drop gamedirs.
	var ext = fname.substr(fname.lastIndexOf('.') + 1);
	if (ext == 'fmf' || ext == 'kpf')	//these are the only files that really make sense in the root.
		return fname;
	if (ext == 'bsp' || ext == 'map' || ext == 'lit' || ext == 'lux')
		return "id1/maps/" + fname;	//bsps get their own extra subdir
	return "id1/" + fname;	//probably a pak. maybe a cfg, no idea really.
}
function showfiles()
{	//print the pending file list in some pretty way
	if (Module.began)
		return;
	Module.setStatus('');
	document.getElementById('dropzone').hidden = false;
	document.getElementById('begin').hidden = false;
	var nt = "Drag gamedirs or individual package files here to make them available!<br/>Active Files:<br/><pre>";
	var keys = Object.keys(Module.files);
	for(var i = 0; i < keys.length; i++)
	{
		if (Module.files[keys[i]] instanceof ArrayBuffer)
		{
			var sz = Module.files[keys[i]].byteLength;
			if (sz > 512*1024)
				sz = (sz / (1024*1024)) + "mb";
			else if (sz > 512)
				sz = (sz / 1024) + "kb";
			else
				sz = (sz) + " bytes";
			nt += "    " + keys[i] + " ("+sz+")<br/>";
		}
		else
			nt += "    " + keys[i] + "<br/>";
	}
	nt += "</pre>("+keys.length+" files)";
	document.getElementById('dropzone').innerHTML = nt;
}
function scanfiles(item,path)
{	//for directory drops
	if (item.isFile)
	{
		item.file(function(f)
		{
			let n = fixupfilepath(f.name, path);
			Module.files[n]=f.arrayBuffer();	//actually a promise...
			Module.files[n].then(buf=>{Module.files[n]=buf;showfiles();});	//try and resolve it now.
    	});
	}
	else if (item.isDirectory)
	{
		// Get folder contents
		var dirReader = item.createReader();
		dirReader.readEntries(function(entries)
		{
			for (var i=0; i<entries.length; i++)
				scanfiles(entries[i], path + item.name + "/");
		});
	}
}
function gotdrop(ev)
{	//user drag+dropped something. 
	ev.preventDefault();
	for (var i = 0; i < ev.dataTransfer.items.length; i++)
		if (ev.dataTransfer.items[i].webkitGetAsEntry)
		{
			var d = ev.dataTransfer.items[i].webkitGetAsEntry();
			if (d)
				scanfiles(d, "");
		}
		else if (ev.dataTransfer.items[i].kind === 'file')
		{
			var f = ev.dataTransfer.items[i].getAsFile();
			var n = fixupfilepath(f.name);
			Module.files[n]=f.arrayBuffer();	//actually a promise...
			Module.files[n].then(buf=>{Module.files[n]=buf;showfiles();});	//try and resolve it now.
		}
	showfiles();
}

// --- Stuck-key fix ---
// When the tab loses focus mid-keypress (Ctrl+Tab, alt-tab, click away), the
// browser never delivers the keyup, so the engine thinks the key/mouse is still
// held (e.g. Ctrl = +attack keeps firing forever). Track held keys and
// synthesize the release when focus is lost.
//
// FTE maps keys by event.keyCode -- but the KeyboardEvent constructor IGNORES
// keyCode/which (they come back as 0), so a naive synthetic keyup releases
// "key 0" and the real Ctrl stays stuck. We keep the numeric keyCode and force
// it onto the synthetic event with defineProperty so the engine actually matches.
(function(){
  var canvas = document.getElementById('canvas');
  var down = new Map();   // keyCode -> {keyCode, which, code, key, location}
  addEventListener('keydown', function(e){
    down.set(e.keyCode, {keyCode:e.keyCode, which:e.which, code:e.code, key:e.key, location:e.location});
  }, true);
  addEventListener('keyup', function(e){ down.delete(e.keyCode); }, true);
  function synthKeyup(d){
    var ev = new KeyboardEvent('keyup', {code:d.code, key:d.key, location:d.location||0, bubbles:true, cancelable:true});
    try { Object.defineProperty(ev, 'keyCode', {get:function(){return d.keyCode;}}); } catch(_){}
    try { Object.defineProperty(ev, 'which',   {get:function(){return d.which||d.keyCode;}}); } catch(_){}
    return ev;
  }
  function releaseAll(){
    var targets = [canvas, document, window].filter(Boolean);
    down.forEach(function(d){
      targets.forEach(function(t){
        try { t.dispatchEvent(synthKeyup(d)); } catch(_){}
      });
    });

    });

  }

  document.addEventListener('visibilitychange', function(){ if (document.hidden) releaseAll(); });
})();

// --- Background-tab keepalive ---
// Browsers pause requestAnimationFrame (and clamp timers) in hidden/background
// tabs, so the engine main loop stops stepping -> it stops sending netchan
// packets -> the server times us out and we return to a dead connection.
// Drive the engine's rAF callbacks from a Web Worker tick while hidden (workers
// aren't subject to the hidden-tab rAF pause nor the 1/min "intensive" timer
// throttling), so a keepalive packet keeps flowing and the slot stays alive.
// When visible, the real requestAnimationFrame is used unchanged.
(function(){
  var realRAF = window.requestAnimationFrame
        ? window.requestAnimationFrame.bind(window)
        : function(cb){ return setTimeout(function(){ cb(performance.now()); }, 16); };
  var realCAF = window.cancelAnimationFrame ? window.cancelAnimationFrame.bind(window) : clearTimeout;
  var pend = [], worker = null;
  function run(rec){
    if (rec.done) return;
    rec.done = true;
    var i = pend.indexOf(rec); if (i >= 0) pend.splice(i, 1);
    try { rec.cb(performance.now()); } catch(e){}
  }
  function fireAll(){
    if (!document.hidden) return;
    var cur = pend.slice();
    for (var i = 0; i < cur.length; i++) run(cur[i]);
  }
  try {
    worker = new Worker(URL.createObjectURL(new Blob(
      ["setInterval(function(){postMessage(0)},100)"], {type:'text/javascript'})));
    worker.onmessage = fireAll;
  } catch(e){}
  // Fallback if the Worker can't be created (CSP/old browser): self-pumping timer.
  function bgPump(){ if (document.hidden && !worker){ fireAll(); setTimeout(bgPump, 200); } }
  window.requestAnimationFrame = function(cb){
    var rec = { cb: cb, done: false, id: 0 };
    pend.push(rec);
    if (!document.hidden) rec.id = realRAF(function(){ run(rec); });
    return rec.id;
  };
  window.cancelAnimationFrame = function(id){
    if (id) for (var i = 0; i < pend.length; i++) if (pend[i].id === id){ pend[i].done = true; pend.splice(i, 1); break; }
    try { realCAF(id); } catch(e){}
  };
  document.addEventListener('visibilitychange', function(){
    if (document.hidden){ fireAll(); bgPump(); }
    else pend.slice().forEach(function(rec){ if (!rec.done && !rec.id) rec.id = realRAF(function(){ run(rec); }); });
  });
})();

// --- Mute audio while the tab is hidden ---
// The background keepalive above keeps the engine running when backgrounded, so
// without this it would keep playing sound in another tab. Capture every
// AudioContext the engine creates and suspend it while hidden; resume on return.
(function(){
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  var ctxs = [];
  function Wrapped(opts){
    var c = new AC(opts);
    ctxs.push(c);
    if (document.hidden) { try { c.suspend(); } catch(e){} }
    return c;
  }
  Wrapped.prototype = AC.prototype;
  window.AudioContext = Wrapped;
  if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
  document.addEventListener('visibilitychange', function(){
    for (var i = 0; i < ctxs.length; i++) {
      try { document.hidden ? ctxs[i].suspend() : ctxs[i].resume(); } catch(e){}
    }
  });
})();
