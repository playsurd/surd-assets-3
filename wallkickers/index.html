function start() {
  document.getElementById('play').hidden = true;
  audio.resume();
  layout();
  setStatus('');
  setTimeout(() => {
    try {
      createContext();
      if (!M._wk_gl_init()) throw new Error('WebGL is not available');
      if (M._wk_start()) throw new Error('startup failed (see console)');
      const lang = (navigator.language || 'en-US').replace('-', '_');
      M.ccall('wk_native_init', null,
        ['string', 'string', 'number', 'number', 'number', 'number', 'number', 'number', 'string', 'string', 'number'],
        ['/app/base.apk/assets', USERDATA, viewW, viewH, 0, 0, 0, 0, lang, ',touch,mobile,phone', 0]);
      M._wk_jni_release_locals();
      M._wk_native_resized(viewW, viewH, 0, 0, 0, 0);
      M._wk_native_activate();
      M._wk_jni_release_locals();
      running = true;
      document.getElementById('loading').style.display = 'none';

const script = document.createElement('script');
script.src = 'app.js';
script.onload = () => {
  createPEModule({
    canvas,
    wkJava,
    print: (t) => console.log(t),
    printErr: (t) => console.warn(t),
    setStatus: (t) => {
      const m = /\((\d+(?:\.\d+)?)\/(\d+)\)/.exec(t);
      if (m) { const pct = Math.floor(100 * m[1] / m[2]); progressEl.style.width = pct + '%'; setStatus(pct + '%'); }
    },
    monitorRunDependencies: () => {},
    locateFile: (p) => p,
    preRun: [(m) => {
      m.FS.mkdirTree(PKG_FILES);
      m.FS.mount(m.IDBFS, {}, PKG_FILES);
      m.addRunDependency('saves');
      m.FS.syncfs(true, (err) => {
        if (err) console.warn('save load', err);
        try { m.FS.mkdirTree(USERDATA); } catch (e) {}
        try { restoreBackup(m); } catch (e) { console.warn('save restore', e); }
        watchSaves(m);
        m.removeRunDependency('saves');
      });
    }],
    onAbort: (what) => fail(what),
  }).then((m) => {
    M = m;
    window.M = m;
    progressEl.style.width = '100%';
    indexZip(m.FS.readFile('/app/base.apk'));
    start(); /* audio unlocks on the first tap/key (browsers require a gesture) */
  }).catch(fail);
};
script.onerror = () => fail('could not load app.js');
layout();
document.body.appendChild(script);
</script>
